<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>MP3 Player</title>

  <style>
    /* 背景 */
    body {
      background: #ffe6f2;
      font-family: "Meiryo", sans-serif;
      padding: 20px;
    }

    /* コンテナ */
    .player-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      max-width:420px;
      margin: 40px auto;
      padding: 20px;
      background: #ffe4c4;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    /* スマホだけ拡大表示 */
    @media (max-width: 1000px) {
      .player-container {
        transform: scale(1.5);
        transform-origin: top left;
      }
    }

    /* タイトル */
    .bgm-title {
      font-size: 22px;
      font-weight: bold;
      margin-top: 10px;
      text-align: center;
      margin-bottom: 2em;
    }

    /* フォルダ領域　*/
    .folder-area {
      margin-bottom: 10px;
      font-size: 20px;     /* 文字サイズ */
      font-weight: bold;   /* 太文字 */
    }

    /* アーティスト名/曲名 */
    .folder-label, .artist-label, .music-label {
      display: inline-block;
      font-size: 18px;     /* 文字サイズ */
      font-weight: bold;   /* 太文字 */
    }

    .music-value-box {
      max-width: 400px;
      padding: 5px;
      border: 2px solid #444;
      background: #fff;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    /* フォルダ選択 */
    .folder-select {
      /*min-width: 120px;*/
      font-size: 20px;
      font-weight: bold;
      padding: 5px 10px;
      border: 2px solid #444;
      margin: 10px 0;
    }

    /* ボタン */
    button {
      font-size: 22px;
      font-weight: bold;
      padding: 12px 25px;
      margin: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      height: 60px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 50px
    }

    /* ボタン色 */
    .btn-pause { background-color: #a0d8ef; }   /* 水色 */
    .btn-play { background-color: #ffb3b3; }    /* ピンク */
    .btn-skip { background-color: #c6ff8a; }  /* 黄緑 */

    button:hover {
      opacity: 0.8;
    }

</style>
</head>

<body>
  <div class="player-container">
    <div class="bgm-title">
      &lt;BGM&gt;
    </div>

    <div class="folder-area">
      <span class="folder-label">フォルダ：</span>
      <select id="folderSelect" class="folder-select">
        <option value="BGM">BGM</option>
        <option value="SAS">SAS</option>
        <option value="Disco">Disco</option>
      </select>
    </div>

    <p class="artist-label">アーティスト名：</p>
    <div class="music-value-box" id="artist-title">-</div>

    <p class="music-label">曲名：</p>
    <div class="music-value-box" id="music-title">-</div>

    <div class="buttons">
      <button id="btn-pause" class="btn-pause" disabled>PAUSE</button>
      <button id="btn-play" class="btn-play">PLAY</button>
      <button id="btn-skip" class="btn-skip" disabled>SKIP</button>
    </div>
  </div>

  <!-- メインスクリプト（ES Module） -->
  <script type="module" src="./main.js"></script>
</body>
</html>
