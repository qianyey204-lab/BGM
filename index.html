<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>GitHub MP3 Player</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
    }
    .player-container {
      width: 360px;
      margin: 40px auto;
      padding: 20px;
      background: #ffe4c4;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .row {
      margin-bottom: 10px;
    }
    .label {
      display: inline-block;
      width: 80px;
    }
    #artist, #title {
      display: inline-block;
      min-width: 200px;
    }
    select {
      min-width: 120px;
    }
    .buttons {
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
    }
    button {
      width: 30%;
      padding: 8px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="player-container">
    <div class="row">
      &lt;&lt;BGM / SAS Player&gt;&gt;
    </div>

    <div class="row">
      <span class="label">フォルダ：</span>
      <select id="folderSelect">
        <option value="BGM">BGM</option>
        <option value="SAS">SAS</option>
      </select>
    </div>

    <div class="row">
      <span class="label">アーティスト：</span>
      <span id="artist">-</span>
    </div>

    <div class="row">
      <span class="label">曲：</span>
      <span id="title">-</span>
    </div>

    <div class="buttons">
      <button id="pauseBtn" disabled>PAUSE</button>
      <button id="playBtn">PLAY</button>
      <button id="skipBtn" disabled>SKIP</button>
    </div>
  </div>

  <!-- メインスクリプト（ES Module） -->
  <script type="module" src="./main.js"></script>
</body>
</html>
